<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday น้องเขม ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

</head>

<body>

<div id="loading">

<div class="gift">

🎁

</div>

<h2>กดของขวัญเพื่อเปิดเซอร์ไพรส์</h2>

<button id="openGift">
เปิดของขวัญ ❤️
</button>

</div>

<div id="main">

<div id="rose"></div>

<div id="hearts"></div>

<section class="hero">

<h1>🎂 Happy Birthday 🎂</h1>

<h2>น้องเขม ❤️</h2>

<p class="age">
26 กรกฎาคม • อายุ 20 ปี
</p>

</section>

<section class="gallery">

<img id="photo" src="images/1.jpg">

<div class="control">

<button onclick="prevPhoto()">⬅</button>

<button onclick="nextPhoto()">➡</button>

</div>

</section>

<section class="letter">

<h2>💌 ถึงน้องเขม</h2>

<p id="typing"></p>

</section>

<section class="love">

<h2>❤️ เราคบกันมาแล้ว ❤️</h2>

<h1 id="timer"></h1>

</section>

<section>

<button class="musicBtn" onclick="playSong()">

🎵 เปิดเพลง "นับหนึ่ง"

</button>

</section>

</div>

<audio id="music">

<source src="music/nabnueng.mp3" type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>
</html>
